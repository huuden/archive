<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f2">
  <title>アーカイブサイト</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f6f2;
      --ink: #20211f;
      --muted: #777871;
      --line: #d9d8d1;
      --frame: #eeede7;
    }
    * { box-sizing: border-box; }
    html { background: var(--paper); }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .page { width: min(1480px, 100%); margin: 0 auto; padding: 0 5.2vw 64px; }
    .masthead {
      min-height: 128px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0; font-size: clamp(23px, 3vw, 34px); font-weight: 600; letter-spacing: .08em; }
    .mark { color: var(--muted); font: 11px/1.6 Arial, sans-serif; letter-spacing: .16em; text-align: right; }
    .intro { padding: clamp(35px, 6vw, 76px) 0 clamp(32px, 4vw, 54px); }
    .intro-label { margin: 0 0 12px; color: var(--muted); font-size: 11px; letter-spacing: .12em; }
    .words { margin: 0; font-size: clamp(17px, 2vw, 22px); font-weight: 400; letter-spacing: .04em; }
    .gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(30px, 4vw, 58px) clamp(16px, 2.2vw, 32px); }
    .item { min-width: 0; }
    .image-button { display: block; width: 100%; padding: 0; border: 0; background: transparent; cursor: zoom-in; text-align: left; }
    .image-frame { display: grid; place-items: center; width: 100%; aspect-ratio: 4 / 3; overflow: hidden; background: var(--frame); }
    .image-frame img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .caption { display: flex; align-items: baseline; gap: 12px; padding-top: 13px; }
    .number { color: var(--muted); font: 11px Arial, sans-serif; letter-spacing: .1em; }
    .name { font-size: 14px; letter-spacing: .04em; }
    .image-button:focus-visible, dialog button:focus-visible { outline: 2px solid #3d514b; outline-offset: 4px; }
    dialog { width: min(94vw, 1200px); max-width: none; max-height: 94vh; padding: 0; border: 0; background: transparent; }
    dialog::backdrop { background: rgb(20 21 19 / 88%); }
    dialog img { display: block; max-width: 100%; max-height: 84vh; margin: auto; object-fit: contain; }
    .dialog-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 0; color: #fff; }
    .dialog-bar span { font-size: 13px; letter-spacing: .06em; }
    .close { padding: 8px 0 8px 16px; border: 0; color: #fff; background: transparent; font: inherit; cursor: pointer; }
    @media (max-width: 850px) { .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 560px) {
      .page { padding: 0 18px 40px; }
      .masthead { min-height: 88px; }
      .mark { font-size: 9px; }
      .intro { padding: 36px 0 30px; }
      .gallery { grid-template-columns: 1fr; gap: 30px; }
      .image-frame { aspect-ratio: 4 / 3; }
      .caption { padding-top: 10px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .image-frame img { transition: transform 300ms ease; }
      .image-button:hover .image-frame img { transform: scale(1.025); }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <h1>アーカイブサイト</h1>
      <div class="mark" aria-label="アーカイブ">PERSONAL<br>ARCHIVE</div>
    </header>
    <section class="intro" aria-label="言葉">
      <p class="intro-label">WORDS</p>
      <p class="words">(ここに言葉)</p>
    </section>
    <section class="gallery" id="gallery" aria-label="写真一覧"></section>
  </main>
  <dialog id="viewer" aria-label="写真の拡大表示">
    <img id="viewer-image" alt="">
    <div class="dialog-bar"><span id="viewer-name"></span><button class="close" id="close-viewer" type="button">閉じる</button></div>
  </dialog>
  <script>
    const photos = ["01.jpg", "02.jpg", "03.jpg", "04.jpg", "05.jpg"];
    const gallery = document.querySelector("#gallery");
    const viewer = document.querySelector("#viewer");
    const viewerImage = document.querySelector("#viewer-image");
    const viewerName = document.querySelector("#viewer-name");

    for (const file of photos) {
      const name = file.replace(/\.jpg$/i, "");
      const item = document.createElement("article");
      item.className = "item";
      const button = document.createElement("button");
      button.className = "image-button";
      button.type = "button";
      button.setAttribute("aria-label", `${name} の写真を拡大`);
      const frame = document.createElement("span");
      frame.className = "image-frame";
      const image = document.createElement("img");
      image.src = `images/${file}`;
      image.alt = name;
      image.loading = "lazy";
      image.decoding = "async";
      frame.append(image);
      button.append(frame);
      button.addEventListener("click", () => {
        viewerImage.src = image.src;
        viewerImage.alt = name;
        viewerName.textContent = name;
        viewer.showModal();
      });
      const caption = document.createElement("div");
      caption.className = "caption";
      const number = document.createElement("span");
      number.className = "number";
      number.textContent = String(photos.indexOf(file) + 1).padStart(2, "0");
      const title = document.createElement("span");
      title.className = "name";
      title.textContent = name;
      caption.append(number, title);
      item.append(button, caption);
      gallery.append(item);
    }

    document.querySelector("#close-viewer").addEventListener("click", () => viewer.close());
    viewer.addEventListener("click", event => {
      if (event.target === viewer) viewer.close();
    });
    viewer.addEventListener("close", () => { viewerImage.removeAttribute("src"); });
  </script>
</body>
</html>
