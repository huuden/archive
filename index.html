<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f1ec">
  <title>アーカイブサイト</title>
  <script>
    // 前回えらんだ「白/黒」を、表示の前に反映する(ちらつき防止)
    try {
      if (localStorage.getItem("archive-theme") === "dark") {
        document.documentElement.dataset.theme = "dark";
        document.querySelector('meta[name="theme-color"]').content = "#0e0e0d";
      }
    } catch (e) {}
  </script>
  <style>
    /* Windows の游ゴシックが細く薄く見えるのを防ぐ */
    @font-face { font-family: "YuGothic M"; src: local("Yu Gothic Medium"), local("YuGothic-Medium"); }
    @font-face { font-family: "YuGothic M"; src: local("Yu Gothic Bold"), local("YuGothic-Bold"); font-weight: 700; }

    :root {
      color-scheme: light;
      --bg: #f3f1ec;
      --ink: #1a1917;
      --muted: #7d796f;
      --line: #d9d5cb;
      --ph: #e5e1d8;
      --bar: rgb(243 241 236 / 82%);
      --gutter: clamp(16px, 4vw, 64px);
      --col-gap: clamp(16px, 2.6vw, 44px);
      --sans: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "YuGothic M", "Yu Gothic", YuGothic, "Noto Sans JP", Meiryo, sans-serif;
      --serif: "Hiragino Mincho ProN", "Yu Mincho", YuMincho, "Noto Serif JP", serif;
      --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Roboto Mono", monospace;
      --ease: cubic-bezier(.2, .7, .2, 1);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0e0e0d;
      --ink: #ecebe6;
      --muted: #8a877f;
      --line: #2b2a27;
      --ph: #1b1b19;
      --bar: rgb(14 14 13 / 80%);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { background: var(--bg); scrollbar-gutter: stable; -webkit-text-size-adjust: 100%; }
    html:has(dialog[open]) { overflow: hidden; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: var(--ink); color: var(--bg); }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }

    .wrap { width: min(1600px, 100%); margin-inline: auto; padding-inline: var(--gutter); }
    .mono { font-family: var(--mono); font-size: 11px; font-weight: 400; letter-spacing: .14em; text-transform: uppercase; }

    /* ── 見出しと言葉 ── */
    .masthead { padding-block: clamp(48px, 8vw, 120px) clamp(40px, 5vw, 72px); }
    h1 {
      margin: 0 0 clamp(40px, 6vw, 88px);
      font-family: var(--serif);
      font-size: clamp(38px, 7vw, 104px);
      font-weight: 400;
      line-height: 1.04;
      letter-spacing: .02em;
    }
    .words {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: var(--col-gap);
      row-gap: 12px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }
    .words .mono { color: var(--muted); padding-top: .6em; }
    .words p {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(19px, 2vw, 28px);
      line-height: 1.8;
      letter-spacing: .04em;
    }

    /* ── 上に貼りつく操作バー ── */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--bar);
      -webkit-backdrop-filter: saturate(1.3) blur(16px);
      backdrop-filter: saturate(1.3) blur(16px);
    }
    .toolbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 52px;
      border-bottom: 1px solid var(--line);
    }
    .index { margin: 0; color: var(--muted); }
    .index span { margin-left: .6em; color: var(--ink); }
    .controls { display: flex; align-items: center; gap: clamp(12px, 3vw, 36px); }
    .seg { display: flex; align-items: center; }
    .seg .mono { margin-right: 6px; color: var(--muted); }
    .seg button {
      position: relative;
      padding: 12px 9px;
      border: 0;
      background: none;
      color: var(--muted);
      font-size: 13px;
      line-height: 1;
      letter-spacing: .06em;
      cursor: pointer;
      transition: color .3s;
    }
    .seg button:hover, .seg button[aria-pressed="true"] { color: var(--ink); }
    .seg button::after {
      content: "";
      position: absolute;
      left: 9px;
      right: 9px;
      bottom: 5px;
      height: 1px;
      background: currentColor;
      transform: scaleX(0);
      transition: transform .4s var(--ease);
    }
    .seg button[aria-pressed="true"]::after { transform: scaleX(1); }

    /* ── 写真のグリッド ── */
    main { padding-top: clamp(28px, 3.4vw, 52px); }
    .grid {
      --cols: 2;
      display: grid;
      grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
      gap: clamp(48px, 6.5vw, 112px) var(--col-gap);
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .grid[data-size="s"] { --cols: 3; row-gap: clamp(36px, 4vw, 64px); }
    .item { min-width: 0; }
    .card {
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: none;
      text-align: left;
      cursor: zoom-in;
      transition: opacity .5s var(--ease);
    }
    .card:focus-visible { outline-offset: 8px; }
    /* 写真は切り取らず、枠の左下にそろえて置く */
    .frame {
      position: relative;
      display: block;
      aspect-ratio: 3 / 2;
      background: var(--ph);
      transition: background-color .8s var(--ease);
    }
    .frame.is-loaded { background: transparent; }
    .frame img {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: left bottom;
      opacity: 0;
      transition: opacity .9s var(--ease);
    }
    .frame.is-loaded img { opacity: 1; }
    .caption {
      position: relative;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: baseline;
      gap: 18px;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .caption::before {
      content: "";
      position: absolute;
      top: -1px;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--ink);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .7s var(--ease);
    }
    .no, .meta { font-family: var(--mono); font-size: 11px; color: var(--muted); }
    .no { letter-spacing: .1em; }
    .meta { letter-spacing: .04em; }
    .name { overflow: hidden; font-size: 14px; letter-spacing: .06em; white-space: nowrap; text-overflow: ellipsis; }
    .grid[data-size="s"] .caption { gap: 12px; margin-top: 12px; padding-top: 10px; }
    .grid[data-size="s"] .name { font-size: 13px; }

    @media (hover: hover) {
      .grid:has(.card:hover) .card:not(:hover) { opacity: .4; }
      .card:hover .caption::before { transform: scaleX(1); }
    }

    /* ── ページの下 ── */
    .site-footer { margin-top: clamp(96px, 14vw, 200px); }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      padding-top: 20px;
      padding-bottom: max(32px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .08em;
    }
    .footer a { color: inherit; text-decoration: none; transition: color .3s; }
    .footer a:hover { color: var(--ink); }

    /* ── 拡大表示 ── */
    .viewer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      margin: 0;
      padding: 0;
      border: 0;
      overflow: hidden;
      background: #0c0c0b;
      color: #ecebe6;
    }
    .viewer::backdrop { background: #0c0c0b; }
    .viewer[open] { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
    .viewer :focus-visible { outline-color: #ecebe6; }
    .viewer button { padding: 0; border: 0; background: none; color: inherit; cursor: pointer; }
    .viewer-bar, .viewer-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-inline: var(--gutter);
    }
    .viewer-bar { padding-top: max(8px, env(safe-area-inset-top)); padding-bottom: 4px; }
    .viewer-count { color: rgb(236 235 230 / 60%); }
    .close {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      font-size: 13px;
      letter-spacing: .08em;
      opacity: .75;
      transition: opacity .3s;
    }
    .close:hover { opacity: 1; }
    .viewer-stage { position: relative; min-height: 0; padding: 8px var(--gutter); touch-action: pan-y pinch-zoom; }
    .viewer-stage img { display: block; width: 100%; height: 100%; object-fit: contain; transition: opacity .25s ease; }
    .viewer-stage img.is-fading { opacity: 0; }
    .viewer-foot {
      padding-top: 14px;
      padding-bottom: max(18px, env(safe-area-inset-bottom));
      border-top: 1px solid rgb(236 235 230 / 10%);
    }
    .viewer-caption { display: flex; align-items: baseline; gap: 18px; min-width: 0; }
    .viewer-caption .no, .viewer-caption .meta { color: rgb(236 235 230 / 55%); }
    .viewer-caption .name { font-size: 14px; }
    .nav { display: flex; flex: none; gap: 8px; }
    .nav button {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border: 1px solid rgb(236 235 230 / 22%);
      border-radius: 50%;
      transition: background-color .3s, border-color .3s;
    }
    .nav button:hover { background: rgb(236 235 230 / 10%); border-color: rgb(236 235 230 / 45%); }

    /* ── 画面の幅ごとの調整 ── */
    @media (min-width: 1400px) {
      .grid[data-size="s"] { --cols: 4; }
    }
    @media (max-width: 700px) {
      .words { grid-template-columns: 1fr; }
      .grid { --cols: 1; }
      .grid[data-size="s"] { --cols: 2; }
      .grid[data-size="l"] .frame { aspect-ratio: var(--ratio, 3 / 2); }
      .grid[data-size="s"] .caption { grid-template-columns: auto minmax(0, 1fr); gap: 8px; }
      .grid[data-size="s"] .meta { display: none; }
      .viewer-stage { padding-inline: 0; }
      .viewer-caption .meta { display: none; }
    }
    @media (max-width: 420px) {
      .seg .mono { display: none; }
    }

    /* ── 動き(動きを減らす設定の人には出さない) ── */
    @media (prefers-reduced-motion: no-preference) {
      html { scroll-behavior: smooth; }
      .item {
        opacity: 0;
        transform: translateY(28px);
        transition: opacity 1.1s var(--ease), transform 1.1s var(--ease);
        transition-delay: var(--delay, 0s);
      }
      .item.is-in { opacity: 1; transform: none; }
      .viewer[open], .viewer[open]::backdrop { animation: fade-in .35s ease; }
      ::view-transition-group(*) { animation-duration: .6s; animation-timing-function: cubic-bezier(.2, .7, .2, 1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .viewer-stage img { transition: none; }
    }
    @keyframes fade-in { from { opacity: 0; } }
  </style>
</head>
<body>
  <header class="masthead wrap" id="top">
    <h1>アーカイブサイト</h1>
    <div class="words">
      <span class="mono">Words</span>
      <p>(ここに言葉)</p>
    </div>
  </header>

  <div class="toolbar">
    <div class="wrap toolbar-inner">
      <p class="mono index">Index<span data-count>00</span></p>
      <div class="controls">
        <div class="seg" role="group" aria-label="写真の大きさ">
          <span class="mono" aria-hidden="true">Size</span>
          <button type="button" data-size-choice="l" aria-pressed="true">大</button>
          <button type="button" data-size-choice="s" aria-pressed="false">小</button>
        </div>
        <div class="seg" role="group" aria-label="背景の色">
          <span class="mono" aria-hidden="true">Tone</span>
          <button type="button" data-theme-choice="light" aria-pressed="true">白</button>
          <button type="button" data-theme-choice="dark" aria-pressed="false">黒</button>
        </div>
      </div>
    </div>
  </div>

  <main class="wrap">
    <ol class="grid" id="gallery" data-size="l" aria-label="写真一覧"></ol>
  </main>

  <footer class="site-footer wrap">
    <div class="footer">
      <span>アーカイブサイト</span>
      <a href="#top" class="mono">Top ↑</a>
    </div>
  </footer>

  <dialog class="viewer" id="viewer" aria-label="写真の拡大表示">
    <div class="viewer-bar">
      <span class="mono viewer-count" id="viewer-count"></span>
      <button type="button" class="close" id="viewer-close">
        閉じる
        <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
    </div>
    <div class="viewer-stage" id="viewer-stage">
      <img id="viewer-image" alt="">
    </div>
    <div class="viewer-foot">
      <div class="viewer-caption">
        <span class="no" id="viewer-no"></span>
        <span class="name" id="viewer-name"></span>
        <span class="meta" id="viewer-meta"></span>
      </div>
      <div class="nav" id="viewer-nav">
        <button type="button" id="viewer-prev" aria-label="前の写真">
          <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10H4M9 5l-5 5 5 5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
        <button type="button" id="viewer-next" aria-label="次の写真">
          <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
        </button>
      </div>
    </div>
  </dialog>

  <script>
    // ─────────────────────────────────────────────
    // 写真のリスト
    // ・写真を増やすときは images フォルダに入れて、ここに1行足す
    // ・name の「(ここに名前)」を書きかえると、一覧と拡大表示に出ます
    // ─────────────────────────────────────────────
    const photos = [
      { file: "01.jpg", name: "(ここに名前)" },
      { file: "02.jpg", name: "(ここに名前)" },
      { file: "03.jpg", name: "(ここに名前)" },
      { file: "04.jpg", name: "(ここに名前)" },
      { file: "05.jpg", name: "(ここに名前)" },
    ];

    const root = document.documentElement;
    const gallery = document.getElementById("gallery");
    const pad = n => String(n).padStart(2, "0");
    const total = pad(photos.length);
    const sizes = [];
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

    const store = {
      get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
      set(key, value) { try { localStorage.setItem(key, value); } catch (e) {} },
    };

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    document.querySelectorAll("[data-count]").forEach(node => { node.textContent = total; });

    // ── 一覧をつくる ──
    const reveal = "IntersectionObserver" in window && !reduceMotion
      ? new IntersectionObserver(entries => {
          entries.filter(entry => entry.isIntersecting).forEach((entry, k) => {
            entry.target.style.setProperty("--delay", `${k * 90}ms`);
            entry.target.classList.add("is-in");
            reveal.unobserve(entry.target);
          });
        }, { rootMargin: "0px 0px -6% 0px" })
      : null;

    photos.forEach((photo, i) => {
      const no = pad(i + 1);
      const item = el("li", "item");
      const card = el("button", "card");
      card.type = "button";
      card.setAttribute("aria-label", `${no} ${photo.name} を大きく見る`);

      const frame = el("span", "frame");
      const img = el("img");
      img.alt = `写真 ${no}`;
      img.decoding = "async";
      if (i > 3) img.loading = "lazy";

      const meta = el("span", "meta");
      const caption = el("span", "caption");
      caption.append(el("span", "no", no), el("span", "name", photo.name), meta);

      img.addEventListener("load", () => {
        const w = img.naturalWidth;
        const h = img.naturalHeight;
        sizes[i] = `${w} × ${h}`;
        meta.textContent = sizes[i];
        frame.style.setProperty("--ratio", `${w} / ${h}`);
        frame.classList.add("is-loaded");
      });
      img.addEventListener("error", () => { meta.textContent = "ファイルが見つかりません"; });
      img.src = `images/${photo.file}`;

      frame.append(img);
      card.append(frame, caption);
      card.addEventListener("click", () => openViewer(i));
      item.style.viewTransitionName = `photo-${i}`;
      item.append(card);
      gallery.append(item);
      if (reveal) reveal.observe(item); else item.classList.add("is-in");
    });

    // ── 拡大表示 ──
    const viewer = document.getElementById("viewer");
    const viewerImage = document.getElementById("viewer-image");
    const viewerStage = document.getElementById("viewer-stage");
    let current = 0;
    let loadToken = 0;

    function fillViewer(i) {
      document.getElementById("viewer-count").textContent = `${pad(i + 1)} / ${total}`;
      document.getElementById("viewer-no").textContent = pad(i + 1);
      document.getElementById("viewer-name").textContent = photos[i].name;
      document.getElementById("viewer-meta").textContent = sizes[i] || "";
      viewerImage.alt = `写真 ${pad(i + 1)}`;
    }

    function openViewer(i) {
      current = i;
      loadToken++;
      viewerImage.classList.remove("is-fading");
      viewerImage.src = `images/${photos[i].file}`;
      fillViewer(i);
      viewer.showModal();
    }

    function step(direction) {
      if (photos.length < 2) return;
      current = (current + direction + photos.length) % photos.length;
      const token = ++loadToken;
      const src = `images/${photos[current].file}`;
      fillViewer(current);
      viewerImage.classList.add("is-fading");
      const next = new Image();
      next.src = src;
      const ready = next.decode ? next.decode().catch(() => {}) : Promise.resolve();
      const faded = new Promise(done => setTimeout(done, reduceMotion ? 0 : 250));
      Promise.all([ready, faded]).then(() => {
        if (token !== loadToken) return;
        viewerImage.src = src;
        viewerImage.classList.remove("is-fading");
      });
    }

    if (photos.length < 2) document.getElementById("viewer-nav").hidden = true;
    document.getElementById("viewer-prev").addEventListener("click", () => step(-1));
    document.getElementById("viewer-next").addEventListener("click", () => step(1));
    document.getElementById("viewer-close").addEventListener("click", () => viewer.close());
    viewer.addEventListener("keydown", event => {
      if (event.key === "ArrowRight") { event.preventDefault(); step(1); }
      if (event.key === "ArrowLeft") { event.preventDefault(); step(-1); }
    });

    // スマホ:左右にスワイプで前後の写真へ
    let touchX = null;
    let touchY = null;
    viewerStage.addEventListener("touchstart", event => {
      if (event.touches.length !== 1) { touchX = null; return; }
      touchX = event.touches[0].clientX;
      touchY = event.touches[0].clientY;
    }, { passive: true });
    viewerStage.addEventListener("touchend", event => {
      if (touchX === null) return;
      const dx = event.changedTouches[0].clientX - touchX;
      const dy = event.changedTouches[0].clientY - touchY;
      if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
      touchX = null;
    }, { passive: true });

    // ── 大/小 と 白/黒 の切りかえ ──
    const sizeButtons = document.querySelectorAll("[data-size-choice]");
    const themeButtons = document.querySelectorAll("[data-theme-choice]");
    const themeColor = document.querySelector('meta[name="theme-color"]');

    function withTransition(update) {
      if (document.startViewTransition && !reduceMotion) document.startViewTransition(update);
      else update();
    }
    function applySize(size) {
      gallery.dataset.size = size;
      sizeButtons.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.sizeChoice === size)));
    }
    function applyTheme(theme) {
      if (theme === "dark") root.dataset.theme = "dark";
      else delete root.dataset.theme;
      themeColor.content = theme === "dark" ? "#0e0e0d" : "#f3f1ec";
      themeButtons.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.themeChoice === theme)));
    }

    applySize(store.get("archive-size") === "s" ? "s" : "l");
    applyTheme(root.dataset.theme === "dark" ? "dark" : "light");

    sizeButtons.forEach(button => button.addEventListener("click", () => {
      const size = button.dataset.sizeChoice;
      if (gallery.dataset.size === size) return;
      store.set("archive-size", size);
      withTransition(() => applySize(size));
    }));
    themeButtons.forEach(button => button.addEventListener("click", () => {
      const theme = button.dataset.themeChoice;
      if ((root.dataset.theme || "light") === theme) return;
      store.set("archive-theme", theme);
      withTransition(() => applyTheme(theme));
    }));
  </script>
</body>
</html>
